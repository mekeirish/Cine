<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cine-Motion Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-deep { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow-pink { box-shadow: 0 0 35px rgba(236, 72, 153, 0.25); }
        .mode-btn.active { background-color: rgba(99, 102, 241, 0.3); border-color: rgba(99, 102, 241, 1); color: white; }
        .filter-btn.active { background-color: rgba(168, 85, 247, 0.3); border-color: rgba(168, 85, 247, 1); color: white; }
        .format-btn.active { background-color: rgba(16, 185, 129, 0.3); border-color: rgba(16, 185, 129, 1); color: white; }
    </style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b6cb7">
<link rel="apple-touch-icon" href="icon.png"></head>
<body class="bg-slate-950 text-white h-[100dvh] flex flex-col justify-between m-0 overflow-hidden select-none">

    <!-- En-tête -->
    <header class="p-4 flex justify-between items-center glass-deep z-20 border-b border-slate-800/80">
        <h1 class="text-xs font-black tracking-widest bg-gradient-to-r from-indigo-400 via-pink-400 to-amber-400 bg-clip-text text-transparent">CINE-MOTION</h1>
        <div id="status-badge" class="px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-slate-800 text-slate-400 border border-slate-700/60">Initialisation...</div>
    </header>

    <!-- Zone de Capture -->
    <main class="flex-1 flex items-center justify-center p-4 relative overflow-hidden">
        <div id="capture-container" class="relative w-full max-w-xs aspect-[9/16] rounded-3xl overflow-hidden glass-deep glow-pink shadow-2xl border border-slate-700/60 flex items-center justify-center">
            <video id="webcam" autoplay playsinline muted class="hidden"></video>
            <video id="playback-video" playsinline muted class="hidden"></video>
            <canvas id="output-canvas" class="w-full h-full object-cover"></canvas>
            
            <div id="countdown-overlay" class="absolute inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200 z-10">
                <span id="countdown-text" class="text-7xl font-black text-pink-500">3</span>
            </div>
        </div>
    </main>

    <!-- Dock -->
    <footer class="p-5 pb-8 glass-deep rounded-t-[2.5rem] flex flex-col gap-4 border-t border-slate-800/80 z-20">
        <!-- Modes de mouvement (6) -->
        <div class="grid grid-cols-3 gap-2">
            <button onclick="setMode('PAN_VERTICAL')" id="btn-pan-v" class="mode-btn flex-1 py-2.5 rounded-xl border text-[10px] font-bold transition-all">Balayage V</button>
            <button onclick="setMode('ZOOM_CENTER')" id="btn-zoom" class="mode-btn flex-1 py-2.5 rounded-xl border text-[10px] font-bold transition-all">Zoom</button>
            <button onclick="setMode('DOLLY_ZOOM')" id="btn-dolly" class="mode-btn flex-1 py-2.5 rounded-xl border text-[10px] font-bold transition-all">Dolly</button>
            <button onclick="setMode('PAN_HORIZONTAL')" id="btn-pan-h" class="mode-btn flex-1 py-2.5 rounded-xl border text-[10px] font-bold transition-all">Balayage H</button>
            <button onclick="setMode('DRIFTY_POV')" id="btn-drifty" class="mode-btn flex-1 py-2.5 rounded-xl border text-[10px] font-bold transition-all">Drifty</button>
            <button onclick="setMode('MICRO_ORBIT')" id="btn-orbit" class="mode-btn flex-1 py-2.5 rounded-xl border text-[10px] font-bold transition-all">Orbite</button>
        </div>

        <!-- Format (Auto, 16:9, 9:16) -->
        <div class="flex justify-center gap-2">
            <span class="text-[9px] font-bold uppercase text-slate-500 self-center mr-1">Format</span>
            <button onclick="setAutoFormat()" id="format-auto" class="format-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 bg-slate-900/60 text-slate-400 transition-all">Auto</button>
            <button onclick="setFormat('16:9')" id="format-16-9" class="format-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 bg-slate-900/60 text-slate-400 transition-all">16:9</button>
            <button onclick="setFormat('9:16')" id="format-9-16" class="format-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 bg-slate-900/60 text-slate-400 transition-all">9:16</button>
        </div>

        <!-- Durée + Filtres -->
        <div class="flex flex-wrap justify-center gap-2">
            <div class="flex gap-1 items-center">
                <span class="text-[9px] font-bold uppercase text-slate-500 mr-1">Durée</span>
                <button onclick="setDuration(3000)" id="dur-3" class="px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 bg-slate-900/60 text-slate-400 transition-all">3s</button>
                <button onclick="setDuration(5000)" id="dur-5" class="px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 bg-slate-900/60 text-slate-400 transition-all">5s</button>
                <button onclick="setDuration(10000)" id="dur-10" class="px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 bg-slate-900/60 text-slate-400 transition-all">10s</button>
            </div>
            <div class="flex gap-1 items-center">
                <span class="text-[9px] font-bold uppercase text-slate-500 mr-1">Filtre</span>
                <button onclick="setFilter('normal')" id="filter-normal" class="filter-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 bg-slate-900/60 text-slate-400 transition-all">Normal</button>
                <button onclick="setFilter('teal')" id="filter-teal" class="filter-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 bg-slate-900/60 text-slate-400 transition-all">Teal</button>
                <button onclick="setFilter('bw')" id="filter-bw" class="filter-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 bg-slate-900/60 text-slate-400 transition-all">N&B</button>
                <button onclick="setFilter('sepia')" id="filter-sepia" class="filter-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 bg-slate-900/60 text-slate-400 transition-all">Sépia</button>
            </div>
        </div>

        <!-- Caméra / Miroir / Aperçu -->
        <div class="flex justify-center gap-2">
            <button onclick="switchCamera()" id="camera-btn" class="px-4 py-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50 text-[10px] font-bold text-slate-300 transition-all">
                🔄 Caméra
            </button>
            <button onclick="toggleMirror()" id="mirror-btn" class="px-4 py-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50 text-[10px] font-bold text-slate-300 transition-all">
                Miroir: OFF
            </button>
            <button onclick="togglePreview()" id="preview-toggle" class="px-4 py-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50 text-[10px] font-bold text-slate-300 transition-all">
                Aperçu : Début
            </button>
        </div>

        <!-- Contrôles lecture / enregistrement / téléchargement -->
        <div class="flex items-center justify-around mt-2">
            <button onclick="togglePlayback()" id="play-btn" disabled class="opacity-30 p-4 transition-opacity">
                <div class="w-12 h-12 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center">
                    <span id="play-icon">▶</span>
                </div>
            </button>
            <button onclick="handleRecordTrigger()" id="record-btn" class="w-20 h-20 rounded-full bg-slate-900 border-4 border-slate-700 shadow-2xl flex items-center justify-center">
                <div id="record-icon" class="w-6 h-6 rounded-md bg-white"></div>
            </button>
            <button onclick="downloadRecording()" id="download-btn" disabled class="opacity-30 p-4 transition-opacity">
                <div class="w-12 h-12 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center">⬇</div>
            </button>
        </div>
    </footer>

    <script>
        const video = document.getElementById('webcam');
        const playbackVideo = document.getElementById('playback-video');
        const canvas = document.getElementById('output-canvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const downloadBtn = document.getElementById('download-btn');
        const statusBadge = document.getElementById('status-badge');
        const previewToggleBtn = document.getElementById('preview-toggle');
        const mirrorBtn = document.getElementById('mirror-btn');
        const cameraBtn = document.getElementById('camera-btn');
        const captureContainer = document.getElementById('capture-container');
        const formatAutoBtn = document.getElementById('format-auto');
        const format169Btn = document.getElementById('format-16-9');
        const format916Btn = document.getElementById('format-9-16');

        let currentMode = 'PAN_VERTICAL';
        let isRecording = false;
        let isPlayingBack = false;
        let animStartTime = null;
        let recordedBlobUrl = null;
        let previewEndState = false;
        let currentDuration = 5000;
        let currentFilter = 'normal';
        let facingMode = 'environment';
        let mirrorEnabled = false;
        let currentStream = null;
        let currentFormat = '9:16'; // '16:9' ou '9:16'
        let autoFormat = true; // Si true, suit l'orientation de l'appareil

        // Courbe d'accélération "Cinéma" (Ease In-Out Cubic)
        const easeInOutCubic = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

        // Filtres pour ctx.filter
        const filters = {
            normal: '',
            teal: 'sepia(0.25) hue-rotate(150deg) saturate(1.5) contrast(1.1)',
            bw: 'grayscale(1)',
            sepia: 'sepia(0.8)',
        };

        // --- Gestion des modes ---
        const modeButtons = {
            PAN_VERTICAL: 'btn-pan-v',
            ZOOM_CENTER: 'btn-zoom',
            DOLLY_ZOOM: 'btn-dolly',
            PAN_HORIZONTAL: 'btn-pan-h',
            DRIFTY_POV: 'btn-drifty',
            MICRO_ORBIT: 'btn-orbit'
        };

        function setMode(mode) {
            if (isRecording || isPlayingBack) return;
            currentMode = mode;
            Object.keys(modeButtons).forEach(key => {
                const btn = document.getElementById(modeButtons[key]);
                if (key === mode) {
                    btn.className = 'mode-btn flex-1 py-2.5 rounded-xl border text-[10px] font-bold transition-all bg-indigo-600/30 border-indigo-500 text-white';
                } else {
                    btn.className = 'mode-btn flex-1 py-2.5 rounded-xl border text-[10px] font-bold transition-all bg-slate-900/60 border-slate-700/50 text-slate-400';
                }
            });
        }

        // --- Durée ---
        function setDuration(duration) {
            if (isRecording || isPlayingBack) return;
            currentDuration = duration;
            document.getElementById('dur-3').className = `px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 transition-all ${duration === 3000 ? 'bg-indigo-600/30 border-indigo-500 text-white' : 'bg-slate-900/60 text-slate-400'}`;
            document.getElementById('dur-5').className = `px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 transition-all ${duration === 5000 ? 'bg-indigo-600/30 border-indigo-500 text-white' : 'bg-slate-900/60 text-slate-400'}`;
            document.getElementById('dur-10').className = `px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 transition-all ${duration === 10000 ? 'bg-indigo-600/30 border-indigo-500 text-white' : 'bg-slate-900/60 text-slate-400'}`;
        }

        // --- Filtres ---
        function setFilter(filter) {
            if (isRecording || isPlayingBack) return;
            currentFilter = filter;
            document.getElementById('filter-normal').className = `filter-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 transition-all ${filter === 'normal' ? 'bg-purple-600/30 border-purple-500 text-white' : 'bg-slate-900/60 text-slate-400'}`;
            document.getElementById('filter-teal').className = `filter-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 transition-all ${filter === 'teal' ? 'bg-purple-600/30 border-purple-500 text-white' : 'bg-slate-900/60 text-slate-400'}`;
            document.getElementById('filter-bw').className = `filter-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 transition-all ${filter === 'bw' ? 'bg-purple-600/30 border-purple-500 text-white' : 'bg-slate-900/60 text-slate-400'}`;
            document.getElementById('filter-sepia').className = `filter-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 transition-all ${filter === 'sepia' ? 'bg-purple-600/30 border-purple-500 text-white' : 'bg-slate-900/60 text-slate-400'}`;
        }

        // --- Miroir ---
        function toggleMirror() {
            if (isRecording || isPlayingBack) return;
            mirrorEnabled = !mirrorEnabled;
            updateMirrorButton();
        }

        function updateMirrorButton() {
            mirrorBtn.textContent = `Miroir: ${mirrorEnabled ? 'ON' : 'OFF'}`;
            mirrorBtn.className = mirrorEnabled 
                ? 'px-4 py-1.5 rounded-lg bg-indigo-600/30 border-indigo-500 text-[10px] font-bold text-white transition-all' 
                : 'px-4 py-1.5 rounded-lg bg-slate-800/60 border-slate-700/50 text-[10px] font-bold text-slate-300 transition-all';
        }

        // --- Changement caméra ---
        async function switchCamera() {
            if (isRecording || isPlayingBack) return;
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            mirrorEnabled = facingMode === 'user';
            updateMirrorButton();
            await initCamera();
            cameraBtn.textContent = facingMode === 'user' ? '🔄 Arrière' : '🔄 Frontale';
        }

        // --- Bascule aperçu début/fin ---
        function togglePreview() {
            previewEndState = !previewEndState;
            updatePreviewButton();
        }

        function updatePreviewButton() {
            previewToggleBtn.textContent = previewEndState ? 'Aperçu : Fin' : 'Aperçu : Début';
            previewToggleBtn.className = previewEndState 
                ? 'px-4 py-1.5 rounded-lg bg-indigo-600/20 border-indigo-500/50 text-[10px] font-bold text-white transition-all' 
                : 'px-4 py-1.5 rounded-lg bg-slate-800/60 border-slate-700/50 text-[10px] font-bold text-slate-300 transition-all';
        }

        // --- Format & orientation ---
        function updateFormatButtons() {
            formatAutoBtn.className = `format-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 transition-all ${autoFormat ? 'bg-emerald-600/30 border-emerald-500 text-white' : 'bg-slate-900/60 text-slate-400'}`;
            format169Btn.className = `format-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 transition-all ${(!autoFormat && currentFormat === '16:9') ? 'bg-emerald-600/30 border-emerald-500 text-white' : 'bg-slate-900/60 text-slate-400'}`;
            format916Btn.className = `format-btn px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-700/50 transition-all ${(!autoFormat && currentFormat === '9:16') ? 'bg-emerald-600/30 border-emerald-500 text-white' : 'bg-slate-900/60 text-slate-400'}`;
        }

        function setAutoFormat() {
            if (isRecording || isPlayingBack) return;
            autoFormat = true;
            applyAutoFormat();
            updateFormatButtons();
        }

        function setFormat(format) {
            if (isRecording || isPlayingBack) return;
            autoFormat = false;
            currentFormat = format;
            applyCanvasSize();
            updateFormatButtons();
        }

        function applyAutoFormat() {
            const isPortrait = window.matchMedia('(orientation: portrait)').matches;
            const newFormat = isPortrait ? '9:16' : '16:9';
            if (newFormat !== currentFormat) {
                currentFormat = newFormat;
                applyCanvasSize();
            }
        }

        function applyCanvasSize() {
            if (currentFormat === '9:16') {
                canvas.width = 1080;
                canvas.height = 1920;
                captureContainer.className = 'relative w-full max-w-xs aspect-[9/16] rounded-3xl overflow-hidden glass-deep glow-pink shadow-2xl border border-slate-700/60 flex items-center justify-center';
            } else { // 16:9
                canvas.width = 1920;
                canvas.height = 1080;
                captureContainer.className = 'relative w-full max-w-md aspect-video rounded-3xl overflow-hidden glass-deep glow-pink shadow-2xl border border-slate-700/60 flex items-center justify-center';
            }
            // Si pas en enregistrement ni lecture, on redessinera au prochain frame
            if (!isRecording && !isPlayingBack) {
                // forcer un rendu immédiat
                requestAnimationFrame(renderLoop);
            }
        }

        // --- Initialisation caméra améliorée (haute résolution) ---
        async function initCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                // Détermine l'orientation pour demander une résolution adaptée
                const isPortrait = window.matchMedia('(orientation: portrait)').matches;
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: isPortrait ? 1080 : 1920 },
                        height: { ideal: isPortrait ? 1920 : 1080 },
                        frameRate: { ideal: 60, max: 60 }
                    },
                    audio: true
                };

                try {
                    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (err) {
                    currentStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: facingMode },
                        audio: true
                    });
                }

                video.srcObject = currentStream;
                await video.play();
                // Ne plus définir canvas.width/height ici car on les gère via applyCanvasSize
                statusBadge.textContent = "Prêt";
                requestAnimationFrame(renderLoop);
            } catch (err) {
                statusBadge.textContent = "Erreur Caméra";
            }
        }

        // --- Calcul du rectangle source pour couvrir le canvas (cover) ---
        function getCoverSourceRect(videoW, videoH, targetW, targetH) {
            const videoRatio = videoW / videoH;
            const targetRatio = targetW / targetH;
            let sx, sy, sw, sh;

            if (videoRatio > targetRatio) {
                // Vidéo plus large : recadrer horizontalement
                sw = videoH * targetRatio;
                sh = videoH;
                sx = (videoW - sw) / 2;
                sy = 0;
            } else {
                // Vidéo plus haute : recadrer verticalement
                sw = videoW;
                sh = videoW / targetRatio;
                sx = 0;
                sy = (videoH - sh) / 2;
            }
            return { sx, sy, sw, sh };
        }

        // --- Calcul des paramètres d'animation pour chaque mode ---
        function getFrameParameters(mode, progress) {
            const smooth = easeInOutCubic(progress);
            // Rectangle source de base pour couvrir le canvas
            const baseRect = getCoverSourceRect(video.videoWidth, video.videoHeight, canvas.width, canvas.height);
            let params = {
                sx: baseRect.sx,
                sy: baseRect.sy,
                sw: baseRect.sw,
                sh: baseRect.sh,
                rotation: 0,
                zoom: 1,
                useTransform: false
            };

            switch (mode) {
                case 'PAN_VERTICAL':
                    params.zoom = 1.35;
                    params.sw = baseRect.sw / params.zoom;
                    params.sh = baseRect.sh / params.zoom;
                    params.sx = baseRect.sx + (baseRect.sw - params.sw) / 2;
                    params.sy = baseRect.sy + (baseRect.sh - params.sh) * (1 - smooth);
                    break;

                case 'ZOOM_CENTER':
                    params.zoom = 1 + (smooth * 0.4);
                    params.sw = baseRect.sw / params.zoom;
                    params.sh = baseRect.sh / params.zoom;
                    params.sx = baseRect.sx + (baseRect.sw - params.sw) / 2;
                    params.sy = baseRect.sy + (baseRect.sh - params.sh) / 2;
                    break;

                case 'DOLLY_ZOOM':
                    params.zoom = 1.6 - (smooth * 0.55);
                    params.sw = baseRect.sw / params.zoom;
                    params.sh = baseRect.sh / params.zoom;
                    params.sx = baseRect.sx + (baseRect.sw - params.sw) / 2;
                    params.sy = baseRect.sy + (baseRect.sh - params.sh) / 2;
                    break;

                case 'PAN_HORIZONTAL':
                    params.zoom = 1.3;
                    params.sw = baseRect.sw / params.zoom;
                    params.sh = baseRect.sh / params.zoom;
                    params.sx = baseRect.sx + (baseRect.sw - params.sw) * smooth;
                    params.sy = baseRect.sy + (baseRect.sh - params.sh) / 2;
                    break;

                case 'DRIFTY_POV':
                    params.zoom = 1.2 + smooth * 0.2;
                    params.sw = baseRect.sw / params.zoom;
                    params.sh = baseRect.sh / params.zoom;
                    params.sx = baseRect.sx + (baseRect.sw - params.sw) * (0.1 + smooth * 0.3);
                    params.sy = baseRect.sy + (baseRect.sh - params.sh) * (0.8 - smooth * 0.5);
                    break;

                case 'MICRO_ORBIT':
                    params.useTransform = true;
                    params.zoom = 1.2 + smooth * 0.2;
                    params.rotation = smooth * 0.12;
                    // Le rectangle source est calculé plus bas dans drawFrame pour intégrer la rotation
                    break;
            }
            return params;
        }

        function drawFrame(params) {
            if (params.useTransform) {
                // Cas MICRO_ORBIT : rotation + zoom
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(params.rotation);
                // Calcul du rectangle source avec zoom à partir du cover de base
                const baseRect = getCoverSourceRect(video.videoWidth, video.videoHeight, canvas.width, canvas.height);
                const sw = baseRect.sw / params.zoom;
                const sh = baseRect.sh / params.zoom;
                const sx = baseRect.sx + (baseRect.sw - sw) / 2;
                const sy = baseRect.sy + (baseRect.sh - sh) / 2;
                // Dessiner centré : le rectangle source est dessiné centré sur le canvas
                ctx.drawImage(video, sx, sy, sw, sh, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
                ctx.restore();
            } else {
                // Dessin standard avec rectangle source
                ctx.drawImage(video, params.sx, params.sy, params.sw, params.sh, 0, 0, canvas.width, canvas.height);
            }
        }

        // --- Boucle de rendu ---
        function renderLoop(timestamp) {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (isPlayingBack) {
                ctx.filter = 'none';
                if (playbackVideo.readyState >= 2) {
                    ctx.drawImage(playbackVideo, 0, 0, canvas.width, canvas.height);
                }
            } else {
                ctx.filter = filters[currentFilter] || 'none';
                if (mirrorEnabled) {
                    ctx.save();
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }

                if (isRecording && animStartTime) {
                    const progress = Math.min((timestamp - animStartTime) / currentDuration, 1);
                    const params = getFrameParameters(currentMode, progress);
                    drawFrame(params);
                    if (progress >= 1) stopRecording();
                } else {
                    const progress = previewEndState ? 1 : 0;
                    const params = getFrameParameters(currentMode, progress);
                    drawFrame(params);
                }

                if (mirrorEnabled) {
                    ctx.restore();
                }
                ctx.filter = 'none';
            }
            requestAnimationFrame(renderLoop);
        }

        // --- Gestion de l'enregistrement avec haute qualité ---
        function handleRecordTrigger() {
            if (isPlayingBack) {
                stopPlayback();
                return;
            }
            if (isRecording) {
                stopRecording();
                return;
            }
            let count = 3;
            document.getElementById('countdown-overlay').style.opacity = '1';
            document.getElementById('countdown-text').textContent = count;
            const timer = setInterval(() => {
                count--;
                document.getElementById('countdown-text').textContent = count;
                if (count <= 0) {
                    clearInterval(timer);
                    document.getElementById('countdown-overlay').style.opacity = '0';
                    startRecording();
                }
            }, 700);
        }

        let mediaRecorder, chunks;
        function startRecording() {
            chunks = [];
            // Capture à 60 fps si possible, sinon 30
            const stream = canvas.captureStream(60);
            
            const mimeTypes = [
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm'
            ];
            const mimeType = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';
            
            const options = {
                mimeType: mimeType,
                videoBitsPerSecond: 8000000
            };
            
            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                recordedBlobUrl = URL.createObjectURL(new Blob(chunks, { type: mimeType || 'video/webm' }));
                playbackVideo.src = recordedBlobUrl;
                playBtn.disabled = false;
                playBtn.className = 'p-4 opacity-100 transition-opacity';
                downloadBtn.disabled = false;
                downloadBtn.className = 'p-4 opacity-100 transition-opacity';
                statusBadge.textContent = "Prêt";
                enableControls(true);
            };
            
            mediaRecorder.start();
            isRecording = true;
            animStartTime = performance.now();
            document.getElementById('record-icon').className = 'w-4 h-4 rounded-sm bg-white animate-pulse';
            statusBadge.textContent = "REC";
            enableControls(false);
        }

        function stopRecording() {
            if (!isRecording) return;
            mediaRecorder.stop();
            isRecording = false;
            animStartTime = null;
            document.getElementById('record-icon').className = 'w-6 h-6 rounded-md bg-white';
        }

        // Active/désactive les contrôles sauf le bouton record
        function enableControls(enabled) {
            const buttons = [
                ...Object.values(modeButtons).map(id => document.getElementById(id)),
                document.getElementById('dur-3'),
                document.getElementById('dur-5'),
                document.getElementById('dur-10'),
                document.getElementById('filter-normal'),
                document.getElementById('filter-teal'),
                document.getElementById('filter-bw'),
                document.getElementById('filter-sepia'),
                document.getElementById('camera-btn'),
                document.getElementById('mirror-btn'),
                document.getElementById('preview-toggle'),
                document.getElementById('format-auto'),
                document.getElementById('format-16-9'),
                document.getElementById('format-9-16')
            ];
            buttons.forEach(btn => btn.disabled = !enabled);

            if (enabled) {
                if (recordedBlobUrl) {
                    playBtn.disabled = false;
                    downloadBtn.disabled = false;
                } else {
                    playBtn.disabled = true;
                    downloadBtn.disabled = true;
                }
            } else {
                playBtn.disabled = true;
                downloadBtn.disabled = true;
            }
        }

        // --- Lecture / Téléchargement ---
        function togglePlayback() {
            if (isRecording) return;
            if (isPlayingBack) {
                stopPlayback();
            } else {
                startPlayback();
            }
        }

        function startPlayback() {
            if (!recordedBlobUrl || isRecording) return;
            isPlayingBack = true;
            playbackVideo.currentTime = 0;
            playbackVideo.play();
            playIcon.textContent = '■';
            statusBadge.textContent = "Lecture";
            enableControls(false);
            playBtn.disabled = false;
            playBtn.className = 'p-4 opacity-100 transition-opacity';
        }

        function stopPlayback() {
            isPlayingBack = false;
            playbackVideo.pause();
            playbackVideo.currentTime = 0;
            playIcon.textContent = '▶';
            statusBadge.textContent = "Prêt";
            enableControls(true);
            if (recordedBlobUrl) {
                playBtn.disabled = false;
                downloadBtn.disabled = false;
            }
        }

        playbackVideo.addEventListener('ended', () => {
            if (isPlayingBack) stopPlayback();
        });

        function downloadRecording() {
            if (!recordedBlobUrl) return;
            const a = document.createElement('a');
            a.href = recordedBlobUrl;
            a.download = `cinema-motion-${Date.now()}.webm`;
            a.click();
        }

        // --- Gestion de l'orientation ---
        function handleOrientationChange() {
            if (autoFormat) {
                applyAutoFormat();
                updateFormatButtons();
            }
        }

        window.addEventListener('resize', handleOrientationChange);
        window.addEventListener('orientationchange', handleOrientationChange);

        // --- Initialisation ---
        window.onload = () => {
            setDuration(5000);
            setFilter('normal');
            setMode('PAN_VERTICAL');
            updateMirrorButton();
            updatePreviewButton();
            // Appliquer le format automatique initial
            applyAutoFormat();
            updateFormatButtons();
            initCamera();
        };
    </script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
</html>
